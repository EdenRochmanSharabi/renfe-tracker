name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: for f in api/*.js lib/*.js; do node --check "$f"; done
      - run: python3 -m py_compile scripts/*.py
      - run: node scripts/test-dispatcher.mjs
