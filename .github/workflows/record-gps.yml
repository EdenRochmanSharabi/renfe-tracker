name: Record GPS positions

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          fetch-depth: 1

      - name: Fetch and store GPS data
        run: |
          mkdir -p gps
          DATE=$(date -u +%Y-%m-%d)
          TS=$(date -u +%s)
          FILE="gps/${DATE}.jsonl"

          # Fetch fleet, extract compact GPS: id, lat, lon, origin, dest, prev, next
          DATA=$(curl -sf "https://renfe-tracker.vercel.app/api/fleet" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          trains = []
          for t in d.get('trenes', []):
              lat = t.get('latitud')
              lon = t.get('longitud')
              if not lat or not lon: continue
              trains.append({
                  'i': t.get('codComercial',''),
                  'la': round(float(lat), 5),
                  'lo': round(float(lon), 5),
                  'o': t.get('codOrigen',''),
                  'd': t.get('codDestino',''),
                  'p': t.get('codEstAnt',''),
                  'n': t.get('codEstSig',''),
              })
          print(json.dumps({'ts': $TS, 't': trains}, separators=(',',':')))
          " 2>/dev/null)

          if [ -z "$DATA" ]; then
            echo "Failed to fetch data"
            exit 0
          fi

          echo "$DATA" >> "$FILE"
          TRAINS=$(echo "$DATA" | python3 -c "import json,sys; print(len(json.load(sys.stdin)['t']))")
          echo "Recorded $TRAINS trains at $(date -u +%H:%M:%S) UTC"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DATE=$(date -u +%Y-%m-%d)
          git add "gps/${DATE}.jsonl"
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "gps: $(date -u +%H:%M) UTC"
          git push
