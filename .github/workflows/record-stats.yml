name: Record train stats

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Ping fleet endpoint (triggers stats recording)
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" "https://renfe-tracker.vercel.app/api/fleet")
          echo "Fleet endpoint returned $status"
          if [ "$status" != "200" ]; then
            echo "Warning: non-200 response"
          fi
