name: validate-data
on:
  schedule:
    - cron: "30 6 * * *"   # 06:30 UTC, validates the previous UTC day
  workflow_dispatch:
    inputs:
      day:
        description: "UTC day to validate (YYYY-MM-DD), default yesterday"
        required: false
permissions:
  contents: read
  issues: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: main }
      - name: Sparse checkout of one day of the data branch
        run: |
          DAY="${{ github.event.inputs.day }}"; [ -n "$DAY" ] || DAY=$(date -u -d yesterday +%F)
          echo "DAY=$DAY" >> "$GITHUB_ENV"
          git clone -q --depth 1 --branch data --filter=blob:none --sparse "https://github.com/${{ github.repository }}.git" data
          git -C data sparse-checkout set --no-cone "/*/$DAY/" "/gps/$DAY.json" "/stats/$DAY.json"
      - name: Validate
        id: v
        shell: bash
        run: python3 -I main/scripts/validate_data.py data "$DAY" | tee report.txt
      - name: Open an issue when the check fails
        if: failure() && steps.v.conclusion == 'failure'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh issue create --repo "${{ github.repository }}" --title "data check failed for $DAY" \
            --body "$(printf 'The daily validation found problems:\n\n```\n%s\n```\nRun: %s/%s/actions/runs/%s' "$(cat report.txt)" "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")"
